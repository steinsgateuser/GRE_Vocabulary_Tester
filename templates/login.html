<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GRE Vocabulary Tester</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f6f7fb;
            color: #171923;
        }

        .card {
            width: min(440px, calc(100% - 32px));
            padding: 36px;

            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 20px;

            text-align: center;

            box-shadow:
                0 10px 30px rgba(17, 24, 39, 0.06);
        }

        .logo {
            width: 52px;
            height: 52px;

            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 15px;

            background: #4f46e5;
            color: white;

            font-size: 22px;
            font-weight: 800;
        }

        h1 {
            margin: 0;
            font-size: 27px;
        }

        .subtitle {
            margin: 10px 0 30px;

            color: #737784;
            font-size: 14px;
        }

        .users {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button {
            min-height: 54px;

            border: 1px solid #e5e7eb;
            border-radius: 11px;

            background: #fafbfc;
            color: #171923;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            transition:
                background 0.15s,
                border 0.15s,
                transform 0.15s;
        }

        button:hover {
            background: #eef2ff;
            border-color: #c7d2fe;
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: default;
            transform: none;
        }

        .error {
            margin-top: 16px;
            padding: 10px;

            border-radius: 8px;

            background: #fef2f2;
            color: #dc2626;

            font-size: 13px;
        }

        .hidden {
            display: none;
        }

    </style>

</head>


<body>

    <div class="card">

        <div class="logo">
            V
        </div>

        <h1>
            GRE Vocabulary Tester
        </h1>

        <div class="subtitle">
            Who are you?
        </div>


        <div class="users">

            <button
                class="user-button"
                data-user="Polo"
            >
                Polo
            </button>

            <button
                class="user-button"
                data-user="Tusu"
            >
                Tusu
            </button>

        </div>


        <div
            id="error"
            class="error hidden"
        ></div>

    </div>


    <script>

        const buttons =
            document.querySelectorAll(
                ".user-button"
            );

        const errorElement =
            document.getElementById("error");


        buttons.forEach(button => {

            button.addEventListener(
                "click",
                async () => {

                    const username =
                        button.dataset.user;

                    buttons.forEach(
                        button => {
                            button.disabled = true;
                        }
                    );

                    errorElement.classList.add(
                        "hidden"
                    );


                    try {

                        const response =
                            await fetch(
                                "/login",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify({
                                            username:
                                                username
                                        })
                                }
                            );


                        const data =
                            await response.json();


                        if (!response.ok) {
                            throw new Error(
                                data.error ||
                                "Login failed."
                            );
                        }


                        window.location.href =
                            "/";


                    } catch (error) {

                        errorElement.textContent =
                            error.message;

                        errorElement.classList.remove(
                            "hidden"
                        );

                    } finally {

                        buttons.forEach(
                            button => {
                                button.disabled = false;
                            }
                        );

                    }

                }
            );

        });

    </script>

</body>

</html>
